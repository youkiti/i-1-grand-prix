interviewTitle: "議員定数削減に関するパブリックコメント分析"
interviewDescription: "議員定数削減についての市民からの意見を分析する"
interviewOverview: |
  国会議員の定数削減は、長年「身を切る改革」の象徴として議論されてきました。
  行政コストの削減を求める声がある一方で、政府監視機能の低下や民意の反映が
  不十分になることへの懸念も根強く残っています。
interviewThemes: |
  - 行政コストの削減と「身を切る改革」
  - 国会の政府監視機能と専門性の維持
  - 一票の較差と民意の反映（比例代表制の役割）
  - 定数削減が議会運営（委員会兼務など）に与える影響
interviewQuestions: |
  - 議員定数削減に賛成ですか、反対ですか？その理由は？
  - 定数削減によるコスト削減効果をどのように評価しますか？
  - 定数削減が民主主義や議会機能に与える悪影響について懸念はありますか？
  - どのような選挙制度が望ましいと考えますか？
knowledgeContext: |
  - 衆議院選挙制度に関する調査会（2014-2016）の議論
  - 「身を切る改革」としての政治公約
  - 委員会兼務率の上昇と審議の質の関係
